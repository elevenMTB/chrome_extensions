<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chrome 代理管理器设置</title>
    <link rel="stylesheet" href="./options.css">
  </head>
  <body>
    <main class="layout">
      <header class="hero">
        <div>
          <h1>Chrome 代理管理器</h1>
          <p>管理多个代理，并按域名规则自动选择代理；未命中时直连。</p>
        </div>
        <div class="hero-actions">
          <label class="toggle">
            <input id="enabledInput" type="checkbox">
            <span>启用插件</span>
          </label>
          <button id="saveButton" type="button">保存并应用</button>
        </div>
      </header>

      <section class="panel">
        <h2>运行模式</h2>
        <div class="grid-2">
          <label>
            模式
            <select id="modeInput">
              <option value="direct">全部直连</option>
              <option value="global">全部代理</option>
              <option value="rule">按规则</option>
            </select>
          </label>
          <label>
            全局代理
            <select id="selectedProxyInput"></select>
          </label>
        </div>
      </section>

      <section class="panel">
        <div class="section-title">
          <h2>代理管理</h2>
          <button id="resetProxyFormButton" class="secondary" type="button">新增代理</button>
        </div>

        <form id="proxyForm" class="form">
          <input id="proxyIdInput" type="hidden">
          <div class="grid-4">
            <label>
              名称
              <input id="proxyNameInput" type="text" placeholder="本地 HTTP 代理" required>
            </label>
            <label>
              类型
              <select id="proxyTypeInput">
                <option value="http">HTTP</option>
                <option value="https">HTTPS</option>
                <option value="socks5">SOCKS5</option>
              </select>
            </label>
            <label>
              Host
              <input id="proxyHostInput" type="text" placeholder="127.0.0.1" required>
            </label>
            <label>
              Port
              <input id="proxyPortInput" type="number" min="1" max="65535" placeholder="7890" required>
            </label>
          </div>
          <label class="checkbox-line">
            <input id="proxyEnabledInput" type="checkbox" checked>
            启用该代理
          </label>
          <button type="submit">保存代理</button>
        </form>

        <div id="proxyList" class="list"></div>
      </section>

      <section class="panel">
        <div class="section-title">
          <h2>规则管理</h2>
          <button id="resetRuleFormButton" class="secondary" type="button">新增规则</button>
        </div>

        <form id="ruleForm" class="form">
          <input id="ruleIdInput" type="hidden">
          <div class="grid-4">
            <label>
              名称
              <input id="ruleNameInput" type="text" placeholder="GitHub" required>
            </label>
            <label>
              类型
              <select id="ruleTypeInput">
                <option value="exact">精确域名</option>
                <option value="wildcard">通配符</option>
                <option value="keyword">关键词</option>
              </select>
            </label>
            <label>
              匹配内容
              <input id="rulePatternInput" type="text" placeholder="github.com / *.google.com / openai" required>
            </label>
            <label>
              使用代理
              <select id="ruleProxyInput"></select>
            </label>
          </div>
          <label class="checkbox-line">
            <input id="ruleEnabledInput" type="checkbox" checked>
            启用该规则
          </label>
          <button type="submit">保存规则</button>
        </form>

        <div id="ruleList" class="list"></div>
      </section>

      <section class="panel">
        <h2>域名测试</h2>
        <div class="inline-form">
          <input id="testHostInput" type="text" placeholder="输入域名或 URL，例如 https://github.com">
          <button id="testButton" type="button">测试</button>
        </div>
        <pre id="testResult" class="result">输入域名后查看命中的规则和代理。</pre>
      </section>

      <section class="panel">
        <h2>导入导出</h2>
        <div class="inline-form">
          <button id="exportButton" type="button">导出 JSON</button>
          <label class="import-button">
            导入 JSON
            <input id="importInput" type="file" accept="application/json,.json">
          </label>
        </div>
      </section>

      <p id="message" class="message"></p>
    </main>

    <script type="module" src="./options.js"></script>
  </body>
</html>
